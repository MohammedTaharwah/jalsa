name: jalsah_platform

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: qna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password123}
      POSTGRES_DB: ${POSTGRES_DB:-qna_platform_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qna_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qna-network

  # -------------------------------------------------------------
  # Backend API Service (FastAPI)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qna_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_secure_password123@postgres:5432/qna_platform_db}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      PORT: ${BACKEND_PORT:-8000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkey_jalsah_2026_replace_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/generate-questions}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-jalsah_n8n_secret_token_2026}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sb-test-client-id-jalsah-2026}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sb-test-client-secret-jalsah-2026}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qna-network

  # -------------------------------------------------------------
  # Frontend Web Client Service (React / Vite)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qna_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_PAYPAL_CLIENT_ID=${VITE_PAYPAL_CLIENT_ID:-sb-test-client-id-jalsah-2026}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - qna-network

  # -------------------------------------------------------------
  # AI Agents & Automation Service (n8n)
  # -------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: qna_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - qna-network

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

# -------------------------------------------------------------
# Shared Internal Network
# -------------------------------------------------------------
networks:
  qna-network:
    driver: bridge
